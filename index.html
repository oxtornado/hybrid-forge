<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hybrid Forge</title>
<style>
:root{
  --bg:#09090b;--s1:#131317;--s2:#1b1b21;--s3:#26262e;--line:#2a2a33;
  --tx:#f7f7f9;--mu:#a4a4ae;--mu2:#6a6a75;
  --red:#ff1f3d;--red-d:#c4001f;--red-soft:rgba(255,31,61,.14);--red-line:rgba(255,31,61,.45);
  --blue:#3b74ff;--blue-soft:rgba(59,116,255,.14);--gold:#ffc83d;--gold-soft:rgba(255,200,61,.13);
  --r:18px;--nav:62px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4}
body{min-height:100vh;padding-bottom:calc(var(--nav) + var(--sb) + 20px)}
body.has-dock{padding-bottom:calc(var(--nav) + var(--sb) + 100px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.4}
a{color:inherit;text-decoration:none}
.app{max-width:560px;margin:0 auto;padding:0 16px}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(var(--st) + 10px) 0 10px;background:linear-gradient(180deg,var(--bg) 75%,rgba(9,9,11,0))}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-style:italic;font-size:16px;letter-spacing:-1px;box-shadow:0 4px 18px rgba(255,31,61,.35)}
.brand-name{font-weight:900;font-style:italic;font-size:16px;letter-spacing:.03em;line-height:1}
.brand-name b{color:var(--red)}
.brand-sub{font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.12em;margin-top:3px;font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center}

/* day chips */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:2px 0 14px}
.dc{position:relative;height:48px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.dc .d{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.dc .dot{width:6px;height:6px;border-radius:50%;background:var(--red)}
.dc.run .dot{background:var(--blue)}.dc.rest .dot{background:var(--mu2)}
.dc.now{border-color:#4a4a55}
.dc.now .d{color:var(--tx)}
.dc.sel{background:var(--tx);border-color:var(--tx)}
.dc.sel .d{color:#111}
.dc .ok{position:absolute;top:-5px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.dc .ok svg{width:10px;height:10px}

/* today header */
.today{position:relative;overflow:hidden;border-radius:22px;padding:16px 16px 14px;margin-bottom:12px;border:1px solid var(--line);background:linear-gradient(150deg,#1a0a0e 0%,#121216 60%)}
.today::before{content:"";position:absolute;right:-30px;top:-30px;width:190px;height:190px;background-image:radial-gradient(rgba(255,31,61,.55) 1.4px,transparent 1.6px);background-size:9px 9px;-webkit-mask-image:radial-gradient(circle at 70% 30%,#000 0%,transparent 68%);mask-image:radial-gradient(circle at 70% 30%,#000 0%,transparent 68%);pointer-events:none}
.today.run{background:linear-gradient(150deg,#0b1020 0%,#121216 60%)}
.today.run::before{background-image:radial-gradient(rgba(59,116,255,.55) 1.4px,transparent 1.6px)}
.today.rest{background:linear-gradient(150deg,#121218 0%,#121216 60%)}
.today.rest::before{opacity:.35}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--red)}
.run .eyebrow,.eyebrow.blue{color:var(--blue)}
.today h1{position:relative;margin:4px 0 2px;font-size:34px;line-height:.95;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.02em}
.today .sub{position:relative;font-size:13.5px;color:#d4d4da}
.effort{position:relative;margin-top:8px;font-size:12.5px;color:var(--mu)}
.effort b{color:var(--tx)}
.bar{position:relative;height:7px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);border-radius:99px;transition:width .35s ease}
.run .bar i{background:var(--blue)}
.bar-lbl{position:relative;display:flex;justify-content:space-between;font-size:11.5px;color:var(--mu);margin-top:6px;font-variant-numeric:tabular-nums}

.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--red-soft);border:1px solid var(--red-line);border-radius:16px;padding:11px 13px;margin-bottom:12px}
.banner b{display:block;font-size:13.5px}.banner span{font-size:12px;color:var(--mu)}

/* generic */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2,.h2{margin:2px 0 0;font-size:18px;font-weight:900;letter-spacing:-.01em}
.muted{color:var(--mu)}.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{min-height:46px;padding:0 16px;border-radius:14px;font-weight:800;font-size:14.5px;background:var(--s3);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mu)}
.btn.danger{background:var(--red-soft);color:var(--red);border:1px solid var(--red-line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.pill{min-width:54px;height:32px;padding:0 10px;border-radius:999px;background:var(--s3);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.tick{width:32px;height:32px;flex:none;border-radius:10px;border:2px solid #3a3a44;display:grid;place-items:center;color:transparent;transition:.18s}
.tick.on{background:var(--red);border-color:var(--red);color:#fff}
.run .tick.on,.tick.on.blue{background:var(--blue);border-color:var(--blue)}

/* warm-up strip */
.warm{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.warm-head{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px}
.warm-head .t b{display:block;font-size:14px}
.warm-head .t span{font-size:12px;color:var(--mu)}
.chev{width:38px;height:38px;border-radius:11px;background:var(--s2);display:grid;place-items:center;transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.checklist{list-style:none;margin:0;padding:0 14px 6px}
.checklist li{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.cl{flex:1;min-width:0}
.cl b{display:block;font-size:14px}
.cl span{display:block;font-size:12px;color:var(--mu);margin-top:1px}
.checklist li.on .cl b{color:var(--mu);text-decoration:line-through;text-decoration-color:var(--red)}

/* focus card */
.focus{scroll-margin-top:72px;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:10px;transition:border-color .3s}
.focus.complete{border-color:var(--red-line)}
.f-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.f-count{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--mu);text-transform:uppercase}
.f-count b{color:var(--tx)}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--s3)}
.dots i.done{background:var(--red)}
.dots i.cur{background:var(--tx);width:16px;border-radius:5px}
.f-name{margin:0;font-size:23px;line-height:1.08;font-weight:900;letter-spacing:-.015em}
.f-mus{font-size:12.5px;color:var(--mu);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:9.5px;font-weight:900;letter-spacing:.1em;padding:2px 6px;border-radius:5px;background:var(--red);color:#fff}
.tag.blue{background:var(--blue)}
.f-body{display:grid;grid-template-columns:120px 1fr;gap:12px;margin:12px 0}
.map{background:var(--s2);border-radius:14px;padding:6px 4px;display:grid;place-items:center}
.map svg{width:100%;height:auto;display:block}
.map .n{fill:#2c2c35}.map .p{fill:var(--red)}.map .s{fill:rgba(255,31,61,.4)}.map .h{fill:#33333d}
.rx{display:grid;gap:6px;align-content:start}
.rx div{background:var(--s2);border-radius:11px;padding:7px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rx span{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.rx b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}

/* gamification */
.game{border-radius:16px;padding:11px 12px;margin-bottom:10px;background:var(--s2);border:1px solid var(--line)}
.game.up{background:linear-gradient(135deg,rgba(255,31,61,.22),rgba(255,31,61,.06));border-color:var(--red-line)}
.game.go{background:linear-gradient(135deg,rgba(59,116,255,.2),rgba(59,116,255,.05));border-color:rgba(59,116,255,.45)}
.game.hold{background:linear-gradient(135deg,var(--gold-soft),transparent);border-color:rgba(255,200,61,.4)}
.g-lvl{font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.up .g-lvl{color:#ff6b7d}.go .g-lvl{color:#8fb0ff}.hold .g-lvl{color:var(--gold)}.info .g-lvl{color:var(--mu)}
.g-target{font-size:24px;font-weight:900;font-style:italic;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.g-msg{font-size:12.5px;color:#d6d6dc;margin-top:2px}
.g-last{font-size:12px;color:var(--mu);margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.1)}
.g-last b{color:var(--tx);font-weight:700}

.set-row{display:grid;grid-template-columns:34px 1fr 1fr 54px;gap:8px;align-items:center;padding:4px 0}
.set-row.head{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu2);font-weight:800;padding-bottom:0}
.set-row.head span:last-child{text-align:center}
.set-n{width:30px;height:30px;border-radius:9px;background:var(--s2);display:grid;place-items:center;font-weight:800;font-size:12.5px;color:var(--mu)}
.set-row input{width:100%;height:50px;border-radius:13px;background:var(--s2);border:1px solid var(--line);text-align:center;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;outline:none;transition:.18s}
.set-row input:focus{border-color:var(--red);background:#1f1216}
.set-row input::placeholder{color:#5c5c66;font-weight:800}
.set-row input:disabled{opacity:.5}
.check{width:54px;height:50px;border-radius:13px;background:var(--s2);border:2px solid #34343d;display:grid;place-items:center;color:#55555f;transition:.18s}
.check.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 16px rgba(255,31,61,.35)}
.set-row.done .set-n{background:var(--red-soft);color:var(--red)}
.set-row.done input{border-color:var(--red-line);color:#ff8090}
.set-row.pr .set-n{background:var(--gold);color:#1a1200;font-size:10px;font-weight:900}
.f-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.f-actions .btn{padding:0 6px;font-size:12.5px;min-height:42px}
.f-actions .btn.on{background:var(--tx);color:#111}
.drawer{margin-top:10px;background:var(--s2);border-radius:14px;padding:12px;animation:drop .2s ease}
.drawer.hidden{display:none}
.dh{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);font-weight:800;margin-bottom:8px}
.drawer ol{margin:8px 0 0;padding-left:20px}
.drawer li{font-size:13.5px;margin:5px 0;color:#e3e3e8}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vid{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;font-weight:800;font-size:13.5px}
.vid.yt{background:#ff0033;color:#fff}
.vid.tt{background:#f2f2f4;color:#111}
.feel p{margin:0 0 8px;font-size:13.5px;color:#e3e3e8}
.feel p b{color:var(--tx)}
.feel .ok{color:#7dffb0}.feel .bad{color:#ff8a98}
.alt{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;position:relative}
.alt b{display:block;font-size:14px;padding-right:56px}
.alt span{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.alt i{position:absolute;right:10px;top:10px;font-style:normal;font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--red);padding:2px 6px;border-radius:5px}
.alt.cur{border-color:var(--red)}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.f-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.xlist{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.xlist-h{padding:11px 14px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);font-weight:800}
.xi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 14px;border-top:1px solid var(--line)}
.xi .n{width:24px;height:24px;border-radius:7px;background:var(--s2);display:grid;place-items:center;font-size:11.5px;font-weight:900;color:var(--mu);flex:none}
.xi .nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xi .c{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.xi.cur{background:rgba(255,255,255,.04)}
.xi.cur .n{background:var(--tx);color:#111}
.xi.done .n{background:var(--red);color:#fff}
.xi.done .nm{color:var(--mu)}
.sessbar{display:flex;gap:8px;margin:4px 0 8px}
.sessbar .btn.red{flex:1}

/* run */
.run-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);font-weight:800}
.field{display:block;width:100%;height:46px;margin-top:5px;border-radius:12px;background:var(--s2);border:1px solid var(--line);padding:0 10px;font-size:16px;font-weight:800;outline:none}
.field:focus{border-color:var(--red)}
.run-grid .field{text-align:center}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.pace{margin-top:10px;font-size:13px;color:var(--mu)}
.pace b{font-size:22px;color:var(--blue);font-weight:900;font-variant-numeric:tabular-nums}

/* timer dock */
.dock{position:fixed;left:10px;right:10px;bottom:calc(var(--nav) + var(--sb) + 8px);z-index:40;max-width:540px;margin:0 auto;background:rgba(22,22,27,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #33333d;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6);transition:transform .3s,opacity .3s}
.dock.hidden{transform:translateY(30px);opacity:0;pointer-events:none}
.dock.running{border-color:var(--red-line)}
.dprog{height:4px;background:rgba(255,255,255,.06)}
.dprog i{display:block;height:100%;background:var(--red);transition:width .25s linear}
.dock-row{display:flex;align-items:center;gap:7px;padding:9px 9px 9px 13px}
.dock-info{flex:1;min-width:0}
.dock-label{display:block;font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.dock-time{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.02;letter-spacing:-.02em}
.dbtn{width:44px;height:44px;border-radius:13px;background:var(--s3);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.dbtn.main{width:54px;height:54px;background:var(--red);color:#fff;border-radius:17px}
.dock.alert{border-color:var(--red);animation:pulse .6s ease-in-out 5}
.dock.alert .dock-time{color:var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--red-line),0 12px 40px rgba(0,0,0,.6)}}
body.flash::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;background:var(--red);animation:flash 1.5s ease-out forwards}
@keyframes flash{0%{opacity:.45}20%{opacity:.04}35%{opacity:.35}55%{opacity:.03}70%{opacity:.25}100%{opacity:0}}

/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.stat b{display:block;font-size:25px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);font-weight:800}
.stat.big{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.mini-ring{width:80px;height:80px;flex:none;position:relative}
.mini-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini-ring div{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:18px}
.heat{display:grid;grid-template-columns:16px repeat(16,1fr);gap:4px;margin-top:10px}
.heat .hl{font-size:9px;color:var(--mu2);display:grid;place-items:center;font-weight:700}
.heat .c{aspect-ratio:1;border-radius:4px;background:var(--s2)}
.heat .c.l-lift{background:var(--red)}.heat .c.l-run{background:var(--blue)}
.heat .c.l-both{background:linear-gradient(135deg,var(--red) 50%,var(--blue) 50%)}
.heat .c.l-rest{background:#44444e}
.heat .c.future{background:transparent;border:1px dashed #22222a}
.heat .c.today{outline:2px solid var(--tx);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--mu)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.sess{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden}
.sess summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.sess summary::-webkit-details-marker{display:none}
.sess .bi{width:5px;align-self:stretch;border-radius:4px;background:var(--red)}
.sess.run .bi{background:var(--blue)}.sess.rest .bi{background:var(--mu2)}
.sess .st b{display:block;font-size:14.5px}
.sess .st span{font-size:12px;color:var(--mu)}
.sess .sv{text-align:right;font-size:12px;color:var(--mu)}
.sess .sv b{display:block;font-size:14.5px;color:var(--tx);font-variant-numeric:tabular-nums}
.sess-body{padding:0 14px 12px;border-top:1px solid var(--line)}
.sx{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.sx span:last-child{color:var(--mu);text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 20px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:6px}
.page-h{margin:4px 2px 12px}
.page-h h1{margin:0;font-size:30px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.page-h p{margin:6px 0 0;color:var(--mu);font-size:13.5px}

/* ask */
.ask-box textarea{display:block;width:100%;min-height:84px;resize:vertical;border-radius:14px;background:var(--s2);border:1px solid var(--line);padding:12px;font-size:16px;outline:none;margin-top:6px}
.ask-box textarea:focus{border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;font-weight:700;padding:8px 11px;border-radius:999px;background:var(--s2);border:1px solid var(--line);text-align:left}
.chip:active{background:var(--red);border-color:var(--red)}
.ans{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:16px;padding:13px 14px;margin-bottom:10px;animation:drop .25s ease}
.ans h3{margin:0 0 6px;font-size:15.5px;font-weight:900}
.ans p{margin:0 0 8px;font-size:14px;color:#dedee4}
.ans p:last-child{margin-bottom:0}
.ans ul{margin:4px 0 8px;padding-left:18px}
.ans li{font-size:14px;color:#dedee4;margin:3px 0}
.ans b{color:var(--tx)}
.ans.warn{border-left-color:var(--gold)}
.q-you{font-size:13px;color:var(--mu);margin:6px 2px 10px}
.q-you b{color:var(--tx)}
.claude{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--s2);font-weight:800;font-size:13.5px;margin-bottom:12px}
.recent{list-style:none;margin:0;padding:0}
.recent li button{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;color:#d6d6dc}

/* settings */
.set-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.set-line:first-of-type{border-top:0}
.set-line b{display:block;font-size:14px;font-weight:700}
.set-line span{display:block;font-size:12px;color:var(--mu)}
.set-line .field{width:150px;margin:0;flex:none}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--s3);transition:.2s}
.switch i::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--red)}
.switch input:checked+i::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--red)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sugg{font-size:12.5px;font-weight:700;padding:8px 10px;border-radius:10px;margin:10px 0 0}
.sugg.up{background:var(--red-soft);color:#ff8a98}.sugg.go{background:var(--blue-soft);color:#8fb0ff}.sugg.hold{background:var(--gold-soft);color:var(--gold)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav) + var(--sb));padding-bottom:var(--sb);background:rgba(11,11,14,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}
.tabbar-in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu2);font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--red)}
.toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translate(-50%,-30px);opacity:0;z-index:120;background:var(--tx);color:#000;font-weight:800;font-size:14px;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:.3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.pr{background:var(--gold);color:#1a1200}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
</style>
</head>

  </header>
  <main id="view" class="view"></main>
</div>
<div id="dock" class="dock hidden" aria-live="polite"></div>
<nav class="tabbar"><div class="tabbar-in">
  <button data-action="goto" data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Workout</button>
  <button data-action="goto" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  <button data-action="goto" data-tab="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.4 7.6L3 21l1.4-5.4A8.5 8.5 0 1 1 21 12z"/><path d="M9.6 9.6a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2-2.4 3.4M12 16.6h.01"/></svg>Ask</button>
</div></nav>
<input type="file" id="importFile" accept="application/json,.json" hidden>

const SR=44100;const SND={};const players={};let actx=null;let audioPrimed=false;
function bell(b,start,base,amp,decay){
  const parts=[[1,1],[2,0.5],[2.76,0.32],[4.07,0.16],[5.4,0.08]];const s0=Math.floor(start*SR);
  for(let i=s0;i<b.length;i++){const t=(i-s0)/SR;let v=0;for(const [m,a] of parts)v+=a*Math.sin(2*Math.PI*base*m*t)*Math.exp(-t*decay*(1+m*0.35));b[i]+=v*amp*Math.min(1,t/0.004);}
}
function synth(name){
  let dur,fill;
  if(name==='tick'){dur=0.14;fill=b=>{for(let i=0;i<b.length;i++){const t=i/SR;b[i]=0.4*Math.sin(2*Math.PI*740*t)*Math.exp(-t*38)*Math.min(1,t/0.003);}};}
  else if(name==='step'){dur=0.9;fill=b=>bell(b,0,784,0.45,5);}
  else if(name==='soft'){dur=1.8;fill=b=>bell(b,0,587.3,0.55,2.6);}
  else if(name==='chime'){dur=1.6;fill=b=>[784,988,1175,1568].forEach((f,i)=>bell(b,i*0.12,f,0.24,3.5));}
  else{dur=2;fill=b=>{bell(b,0,880,0.4,3.2);bell(b,0.36,880,0.4,3.2);bell(b,0.72,1046.5,0.32,2.4);};}
  const b=new Float32Array(Math.ceil(dur*SR));fill(b);
  let pk=0;for(let i=0;i<b.length;i++)pk=Math.max(pk,Math.abs(b[i]));if(pk>0.92)for(let i=0;i<b.length;i++)b[i]*=0.92/pk;
  const f=Math.floor(0.04*SR);for(let i=0;i<f;i++)b[b.length-1-i]*=i/f;
  return b;
}
function snd(name){return SND[name]||(SND[name]={pcm:synth(name)});}
function wavUrl(name){
  const c=snd(name);if(c.url)return c.url;const p=c.pcm,n=p.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,p[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true);}
  c.url=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));return c.url;
}
function player(n){if(!players[n]){const a=new Audio(wavUrl(n));a.preload='auto';players[n]=a;}return players[n];}
function unlockAudio(){

      if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}
      if(actx&&actx.state==='suspended')actx.resume();

        const done=()=>{if(a._prime){a.pause();a.currentTime=0;}a._prime=false;a.muted=false;};if(p&&p.then)p.then(done).catch(()=>{a._prime=false;a.muted=false;});else done();});

}

function playSound(n,vol){

  const line=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');const gid='g'+Math.random().toString(36).slice(2,7);

    <polygon points="${X(0)},${H-py} ${line} ${X(pts.length-1)},${H-py}" fill="url(#${gid})"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

function findExercise(q){

 {keys:['after (the |my |a |each )?(workout|session|training|gym|lifting)','after training','post.?workout','despues de entrenar','when i finish','i finish'],title:'How you should feel after a session',

function exCards(ex,name,it){

function answerQ(q,ctxId){
  const n=norm(q);const it={};Object.keys(INTENT).forEach(k=>{it[k]=has(n,INTENT[k]);});
  let hit=findExercise(q);let exId=hit?hit.id:null;let exName=hit?hit.name:null;
  const anyEx=it.feel||it.pain||it.sore||it.form||it.alt||it.weight||it.rest;
  const kb=KB().map(e=>({e,sc:e.keys.filter(k=>new RegExp('\\b'+k).test(n)).length})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  const iv=Object.values(INTENT);const topic=kb.some(x=>!iv.includes(x.e.keys));
  const saysThis=/\b(this|that|it|este|esta|esto|ese)\b/.test(n);
  if(!exId&&ctxId&&EX[ctxId]&&(saysThis||(anyEx&&!topic))){exId=ctxId;exName=EX[ctxId].name;}
  const cards=exId?exCards(EX[exId],exName,it):[];
  kb.forEach(({e})=>{if(cards.length>=4)return;if(exId&&((e.keys===INTENT.weight&&it.weight)||(e.keys===INTENT.alt&&it.alt)||(e.keys===INTENT.rest&&it.rest)))return;cards.push(e);});

  return {q,exId,cards};
}

function finishSession(){
  const a=state.active;if(!a)return;const day=dayById(a.dayId);
  const entry={id:uid(),dayId:day.id,title:day.title,tag:day.tag,type:day.type,date:ymd(new Date(a.startedAt)),startedAt:a.startedAt,endedAt:Date.now(),
    durationMin:Math.max(1,Math.round((Date.now()-a.startedAt)/60000)),exercises:[],volume:0,setsDone:0,phase:phaseInfo().name,
    mobilityDone:Object.keys(a.checks).filter(k=>k.startsWith('mob-')&&a.checks[k]).length};
  if(day.type==='lift'){
    day.exercises.forEach(ex=>{Object.keys(a.sets).filter(k=>k===ex.id||k.startsWith(ex.id+'~')).forEach(k=>{
      const done=a.sets[k].filter(s=>s.done).map(s=>({w:num(s.w),r:num(s.r)}));
      if(done.length){entry.exercises.push({key:k,name:exNameByKey(k),muscle:ex.muscle,sets:done});entry.setsDone+=done.length;entry.volume+=done.reduce((t,s)=>t+s.w*s.r,0);}});});
    if(!entry.setsDone&&!confirm('No sets were checked off. Save anyway?'))return;
  }else if(day.type==='run'){
    const km=num(a.run.km),min=num(a.run.min);let pace='';
    if(km>0&&min>0){const p=min/km;let m=Math.floor(p),s=Math.round((p-m)*60);if(s===60){m++;s=0;}pace=`${m}:${pad(s)} /km`;}
    entry.run={km:a.run.km,min:a.run.min,rpe:a.run.rpe,pace,blocksDone:Object.keys(a.checks).filter(k=>k.startsWith('run-')&&a.checks[k]).length};
  }else entry.tasksDone=day.checklist.filter(c=>a.checks[c.k]).length;
  const prev=state.history.slice().reverse().find(h=>h.dayId===day.id&&h.type==='lift');
  state.history.push(entry);state.active=null;save();releaseWake();
  if(T.dayId===entry.dayId&&T.queue.length)timerClear();
  chime('step');vib([40,40,80]);
  let msg='Session saved — streak updated';
  if(day.type==='lift'){msg=`Saved · ${entry.setsDone} sets · ${Math.round(entry.volume).toLocaleString()} kg`;if(prev&&prev.volume>0){const d=Math.round((entry.volume/prev.volume-1)*100);msg+=` (${d>=0?'+':''}${d}% vs last)`;}}
  toast(msg);ui.tab='progress';render();try{window.scrollTo(0,0);}catch(e){}
}

    const day=curDay();if(!ensureSession(day))return;const a=state.active;const k=el.dataset.k;
    a.checks[k]=!a.checks[k];save();vib(12);
    el.classList.toggle('on',a.checks[k]);const li=el.closest('li');if(li)li.classList.toggle('on',a.checks[k]);updateProgress();
  },
  flow:el=>{
    const day=curDay();if(!ensureSession(day))return;const a=state.active;let items=[];
    if(el.dataset.src==='mob')items=MOB[day.mobility].items.map((it,i)=>({label:it.n,secs:it.s,check:'mob-'+i})).filter(x=>!a.checks[x.check]);
    else day.blocks(phaseInfo()).forEach(b=>{const k='run-'+b.k;if(a.checks[k])return;if(b.seq)b.seq.forEach((s,j)=>items.push({label:s.label,secs:s.secs,check:j===b.seq.length-1?k:null}));else items.push({label:b.label,secs:b.secs,check:k});});
    if(!items.length){toast('Everything here is already done');return;}
    const first=items.shift();timerStart(first.secs,first.label,items,first.check,day.id);toast(`Guided: ${first.label}`);
  },
  timeOne:el=>{const day=curDay();timerStart(+el.dataset.secs,el.dataset.label,[],isLive(day)?el.dataset.k||null:null,ui.dayId);},
  timerToggle:()=>timerToggle(),
  timerAdjust:el=>timerAdjust(+el.dataset.d),
  timerClear:()=>timerClear(),
  testSound:()=>{unlockAudio();setTimeout(()=>chime('done'),60);vib([200,100,200]);},
  askAbout:el=>{ui.askEx=el.dataset.ex;ui.answer=null;goto('ask');const t=$('#askQ');if(t)t.focus();},
  ask:()=>{const t=$('#askQ');doAsk(t?t.value:'');},
  askChip:el=>doAsk(el.dataset.q,el.dataset.ex!=null&&el.dataset.ex!==undefined&&el.hasAttribute('data-ex')?el.dataset.ex:null),
  logBw:()=>{const inp=$('#bwInput');const kg=num(inp.value);if(kg<30||kg>250)return toast('Enter a valid weight in kg');
    const d=ymd(new Date());const ex=state.bodyweight.find(e=>e.d===d);if(ex)ex.kg=kg;else state.bodyweight.push({d,kg});state.profile.weight=kg;save();render();toast(`Logged ${kg} kg`);},
  delSession:el=>{if(!confirm('Delete this session from history?'))return;state.history=state.history.filter(h=>h.id!==el.dataset.id);save();render();},
  exportData:()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`hybrid-forge-backup-${ymd(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Backup exported');},
  importData:()=>$('#importFile').click(),
  resetAll:()=>{if(!confirm('Reset ALL data (history, logs, settings)? This cannot be undone.'))return;localStorage.removeItem(LS_KEY);localStorage.removeItem(LS_TIMER);state=DEFAULT();timerClear();releaseWake();ui.dayId=dayForDow(new Date().getDay()).id;ui.answer=null;save();goto('train');toast('Fresh start');}
};
function handleImport(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.history))throw new Error('bad');
    if(!confirm(`Import backup with ${d.history.length} sessions? This replaces current data.`))return;
    localStorage.setItem(LS_KEY,JSON.stringify(d));state=load();save();render();toast('Backup imported');}catch(e){toast('That file is not a valid backup');}};
  r.readAsText(file);
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=actions[el.dataset.action];if(fn){e.preventDefault();fn(el,e);}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.matches('.set-row input')){const day=curDay();if(!ensureSession(day))return;const row=el.closest('.set-row');const arr=state.active.sets[row.dataset.key];if(!arr)return;arr[+row.dataset.i][el.dataset.f]=el.value.replace(',','.').trim();saveSoon();}
  else if(el.dataset.run){const day=curDay();if(!ensureSession(day))return;state.active.run[el.dataset.run]=el.value;updatePace();saveSoon();}
  else if(el.dataset.setting&&el.type==='range'){state.settings[el.dataset.setting]=+el.value;saveSoon();}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.run){if(state.active){state.active.run[el.dataset.run]=el.value;updatePace();save();}}
  else if(el.dataset.setting){const k=el.dataset.setting;state.settings[k]=el.type==='checkbox'?el.checked:(isNaN(+el.value)?el.value:+el.value);save();
    if(k==='wakeLock')state.settings[k]?requestWake():releaseWake();
    if(k==='volume'){unlockAudio();chime('step');}
    if(k==='alertSound'||k==='audioEngine'){audioPrimed=false;unlockAudio();setTimeout(()=>chime('done'),80);}}
  else if(el.dataset.profile){const k=el.dataset.profile;
    if(k==='startDate'){if(!el.value)return;state.profile[k]=el.value;}else if(k==='sex')state.profile[k]=el.value;else state.profile[k]=el.value===''?'':num(el.value);
    save();render();}
  else if(el.id==='histSelect'){ui.histKey=el.value;render();}
  else if(el.id==='askEx'){ui.askEx=el.value;const q=$('#askQ');const keep=q?q.value:'';render();const q2=$('#askQ');if(q2)q2.value=keep;}
  else if(el.id==='importFile'){handleImport(el.files[0]);el.value='';}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('.set-row input'))e.target.blur();
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='askQ'){e.preventDefault();doAsk(e.target.value);}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){requestWake();tick();}else{save();persistTimer();}});
window.addEventListener('pagehide',()=>{save();persistTimer();});

render();
if(state.active)requestWake();
})();
</script>
</body>
</html>
