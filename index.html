<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hybrid Forge</title>
<style>
:root{
  --bg:#09090b;--s1:#111114;--s2:#18181d;--s3:#222229;--line:#2a2a33;
  --tx:#f5f5f7;--mu:#a1a1ab;--mu2:#6c6c77;
  --volt:#d7ff3c;--volt-ink:#0b0d00;--ora:#ff6b2c;--red:#ff4d5e;--blue:#4dc3ff;--violet:#a98bff;
  --r:18px;--nav:66px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4}
body{min-height:100vh;padding-bottom:calc(var(--nav) + var(--sb) + 20px)}
body.has-dock{padding-bottom:calc(var(--nav) + var(--sb) + 104px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
.app{max-width:640px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--st) + 12px) 0 12px;background:linear-gradient(180deg,var(--bg) 72%,rgba(9,9,11,0))}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--volt);color:var(--volt-ink);display:grid;place-items:center;font-weight:900;font-size:18px;font-style:italic;letter-spacing:-1px}
.brand-name{font-weight:900;font-style:italic;letter-spacing:.02em;font-size:17px;line-height:1}
.brand-name b{color:var(--volt)}
.brand-sub{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.12em;margin-top:3px}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 14px}
.wd{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:8px 2px 7px;text-align:center;position:relative;min-height:62px;transition:.2s}
.wd .d{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.wd .t{font-size:11px;font-weight:800;margin-top:4px;line-height:1.1}
.wd .dot{width:6px;height:6px;border-radius:50%;margin:6px auto 0;background:var(--s3)}
.wd.lift .dot{background:var(--volt)}.wd.run .dot{background:var(--ora)}.wd.rest .dot{background:var(--mu2)}
.wd.today{border-color:#3a3a45}
.wd.today .d{color:var(--tx)}
.wd.sel{background:var(--tx);color:#000;border-color:var(--tx)}
.wd.sel .d{color:#333}
.wd .ok{position:absolute;top:-5px;right:-4px;width:17px;height:17px;border-radius:50%;background:var(--volt);color:var(--volt-ink);display:grid;place-items:center}
.wd .ok svg{width:11px;height:11px}

/* hero */
.hero{border-radius:24px;padding:20px 18px 18px;background:radial-gradient(120% 90% at 100% 0%,rgba(215,255,60,.20),transparent 55%),linear-gradient(160deg,#17171c,#0f0f12);border:1px solid var(--line);margin-bottom:14px;overflow:hidden;position:relative}
.hero.t-run{background:radial-gradient(120% 90% at 100% 0%,rgba(255,107,44,.25),transparent 55%),linear-gradient(160deg,#17171c,#0f0f12)}
.hero.t-rest{background:radial-gradient(120% 90% at 100% 0%,rgba(77,195,255,.18),transparent 55%),linear-gradient(160deg,#17171c,#0f0f12)}
.hero-top{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:5px 9px;border-radius:999px;background:var(--volt);color:var(--volt-ink)}
.t-run .chip:first-child{background:var(--ora);color:#160700}
.t-rest .chip:first-child{background:var(--blue);color:#001522}
.chip.ghost{background:rgba(255,255,255,.07);color:var(--tx)}
.hero h1{margin:14px 0 6px;font-size:36px;line-height:.95;font-weight:900;font-style:italic;letter-spacing:-.02em;text-transform:uppercase}
.hero h1 em{display:block;font-style:normal;font-size:15px;letter-spacing:.04em;color:var(--mu);margin-top:7px;font-weight:700;text-transform:none}
.hero p{margin:0;color:#cfcfd6;font-size:14px}
.hero-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hero-meta div{background:rgba(255,255,255,.05);border-radius:12px;padding:9px 10px}
.hero-meta b{display:block;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.hero-meta span{font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em}
.progress{height:8px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:14px;overflow:hidden}
.progress .bar{height:100%;background:var(--volt);border-radius:99px;transition:width .35s ease}
.t-run .progress .bar{background:var(--ora)}.t-rest .progress .bar{background:var(--blue)}
.prog-lbl{font-size:12px;color:var(--mu);margin-top:6px}

.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,107,44,.12);border:1px solid rgba(255,107,44,.4);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.banner b{display:block;font-size:14px}.banner span{font-size:12px;color:var(--mu)}
.hint{font-size:13px;color:var(--mu);background:var(--s1);border:1px dashed var(--line);border-radius:14px;padding:11px 13px;margin:0 0 12px}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2,.section-title h2{margin:2px 0 0;font-size:19px;font-weight:900;letter-spacing:-.01em}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--volt);font-weight:800}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;margin:22px 2px 12px}
.muted{color:var(--mu)}.small{font-size:12.5px}
.note{background:linear-gradient(160deg,rgba(215,255,60,.06),transparent 60%),var(--s1)}
.note b{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--volt)}
.note p,.note li{color:#d6d6dc;font-size:14px}
.note ul{padding-left:18px;margin:8px 0 0}

/* buttons */
.btn{min-height:48px;padding:0 18px;border-radius:14px;font-weight:800;font-size:15px;background:var(--s3);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.volt{background:var(--volt);color:var(--volt-ink)}
.btn.ora{background:var(--ora);color:#170700}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mu)}
.btn.danger{background:rgba(255,77,94,.12);color:var(--red);border:1px solid rgba(255,77,94,.35)}
.btn.sm{min-height:38px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.grow{flex:1}
.btn svg{flex:none}
.link{color:var(--volt);font-weight:700;font-size:13px;padding:6px 0}
.pill{min-width:58px;height:34px;padding:0 10px;border-radius:999px;background:var(--s3);font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tx);flex:none}
.pill:active{background:var(--volt);color:var(--volt-ink)}
.finish-bar{display:flex;gap:10px;margin:18px 0 6px}

/* checklist */
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.checklist li:first-child{border-top:0}
.cl-body{flex:1;min-width:0}
.cl-body b{display:block;font-size:14.5px}
.cl-body span{display:block;font-size:12.5px;color:var(--mu);margin-top:2px}
.checklist li.on .cl-body b{color:var(--mu);text-decoration:line-through;text-decoration-color:var(--volt)}
.tick{width:34px;height:34px;flex:none;border-radius:11px;border:2px solid #3a3a44;display:grid;place-items:center;color:transparent;transition:.2s}
.tick.on{background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}

/* exercise */
.ex{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px;transition:border-color .3s}
.ex.complete{border-color:rgba(215,255,60,.55)}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.ex-idx{width:34px;height:34px;flex:none;border-radius:11px;background:var(--s3);display:grid;place-items:center;font-weight:900;font-style:italic;font-size:15px}
.ex.complete .ex-idx{background:var(--volt);color:var(--volt-ink)}
.ex-title{flex:1;min-width:0}
.ex-title h3{margin:0;font-size:17px;font-weight:800;line-height:1.2}
.ex-mus{font-size:12px;color:var(--mu);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pri{font-size:9.5px;font-weight:900;letter-spacing:.1em;color:var(--volt-ink);background:var(--volt);padding:2px 6px;border-radius:5px}
.swapped{font-size:9.5px;font-weight:900;letter-spacing:.1em;color:#170700;background:var(--ora);padding:2px 6px;border-radius:5px}
.rx{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;margin:12px 0 10px}
.rx div{background:var(--s2);border-radius:11px;padding:8px 10px}
.rx b{display:block;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.rx span{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em}
.last{font-size:12.5px;color:var(--mu);margin-bottom:6px}
.last b{color:var(--tx);font-weight:700}
.sugg{font-size:12.5px;font-weight:700;padding:8px 10px;border-radius:10px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.sugg.up{background:rgba(215,255,60,.12);color:var(--volt)}
.sugg.go{background:rgba(77,195,255,.1);color:var(--blue)}
.sugg.hold{background:rgba(255,107,44,.12);color:var(--ora)}
.sugg.info{background:rgba(255,255,255,.05);color:#d0d0d6}
.set-row{display:grid;grid-template-columns:34px 1fr 1fr 50px;gap:8px;align-items:center;padding:4px 0}
.set-row.head{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu2);font-weight:800;padding-bottom:2px}
.set-row.head span:last-child{text-align:center}
.set-n{width:30px;height:30px;border-radius:9px;background:var(--s2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--mu)}
.set-row input{width:100%;height:46px;border-radius:12px;background:var(--s2);border:1px solid var(--line);text-align:center;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;outline:none;transition:.2s}
.set-row input:focus{border-color:var(--volt);background:#1d1f14}
.set-row input::placeholder{color:#5a5a64;font-weight:700}
.set-row input:disabled{opacity:.55}
.check{width:50px;height:46px;border-radius:12px;background:var(--s2);border:2px solid #34343d;display:grid;place-items:center;color:#55555f;transition:.18s}
.check.on{background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}
.set-row.done .set-n{background:rgba(215,255,60,.15);color:var(--volt)}
.set-row.done input{border-color:rgba(215,255,60,.35);color:var(--volt)}
.ex-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ex-actions .btn{flex:1;min-width:0;padding:0 8px}
.drawer{margin-top:10px;background:var(--s2);border-radius:14px;padding:12px;animation:drop .22s ease}
.drawer.hidden{display:none}
.drawer-h{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);font-weight:800;margin-bottom:8px}
.drawer ol{margin:0;padding-left:20px}
.drawer li{font-size:14px;margin:6px 0;color:#e2e2e8}
.alt{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;position:relative}
.alt b{display:block;font-size:14px}
.alt span{display:block;font-size:12px;color:var(--mu);margin-top:2px;padding-right:56px}
.alt i{position:absolute;right:10px;top:10px;font-style:normal;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--volt-ink);background:var(--volt);padding:2px 6px;border-radius:5px}
.alt.cur{border-color:var(--volt)}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* run */
.run-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.run-grid label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);font-weight:800}
.run-grid input,.run-grid select,.field{display:block;width:100%;height:46px;margin-top:5px;border-radius:12px;background:var(--s2);border:1px solid var(--line);padding:0 10px;font-size:16px;font-weight:800;outline:none}
.run-grid input{text-align:center}
.field:focus,.run-grid input:focus{border-color:var(--volt)}
.pace{margin-top:12px;font-size:13px;color:var(--mu)}
.pace b{font-size:22px;color:var(--ora);font-weight:900;font-variant-numeric:tabular-nums}

/* dock timer */
.dock{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + var(--sb) + 8px);z-index:40;max-width:616px;margin:0 auto;background:rgba(24,24,29,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #33333d;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.55);transition:transform .3s,opacity .3s}
.dock.hidden{transform:translateY(30px);opacity:0;pointer-events:none}
.dock .dprog{height:4px;background:rgba(255,255,255,.07)}
.dock .dprog i{display:block;height:100%;background:var(--volt);transition:width .25s linear}
.dock-row{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px}
.dock-info{flex:1;min-width:0;text-align:left}
.dock-label{display:block;font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.dock-time{display:block;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.02em}
.dock-next{display:block;font-size:11px;color:var(--mu2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn{width:44px;height:44px;border-radius:13px;background:var(--s3);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.dbtn.main{width:52px;height:52px;background:var(--volt);color:var(--volt-ink);border-radius:16px}
.dock.alert{border-color:var(--volt);animation:pulse 0.6s ease-in-out 5}
.dock.alert .dock-time{color:var(--volt)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(215,255,60,.35),0 12px 40px rgba(0,0,0,.55)}}
body.flash::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;background:var(--volt);animation:flash 1.6s ease-out forwards}
@keyframes flash{0%{opacity:.5}20%{opacity:.05}35%{opacity:.4}55%{opacity:.03}70%{opacity:.3}100%{opacity:0}}

/* timer view */
.ring-wrap{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:8px auto 14px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--s2);stroke-width:14}
.ring{fill:none;stroke:var(--volt);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.t-label{font-size:13px;color:var(--mu);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.t-time{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.t-next{font-size:12px;color:var(--mu2);margin-top:6px}
.t-ctrl{display:flex;align-items:center;justify-content:center;gap:14px}
.t-ctrl .dbtn{width:62px;height:62px;border-radius:20px;font-size:15px}
.t-ctrl .dbtn.main{width:84px;height:84px;border-radius:28px}
.t-ctrl .dbtn.main svg{width:32px;height:32px}
.t-sub{display:flex;justify-content:center;gap:8px;margin:14px 0 18px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.presets button{height:48px;border-radius:13px;background:var(--s2);border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.presets button.on{border-color:var(--volt);color:var(--volt)}
.queue{list-style:none;margin:8px 0 0;padding:0}
.queue li{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid var(--line);color:#d4d4da}
.queue li span:last-child{color:var(--mu);font-variant-numeric:tabular-nums}

/* switches */
.set-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.set-line:first-of-type{border-top:0}
.set-line b{display:block;font-size:14.5px;font-weight:700}
.set-line span{display:block;font-size:12px;color:var(--mu)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--s3);transition:.2s}
.switch i::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--volt)}
.switch input:checked+i::after{transform:translateX(20px);background:#0b0d00}
input[type=range]{width:100%;accent-color:var(--volt)}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);font-weight:800}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);font-weight:800}
.stat.big{grid-column:1/-1;display:flex;align-items:center;gap:16px}
.mini-ring{width:84px;height:84px;flex:none;position:relative}
.mini-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini-ring div{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:18px}
.heat{display:grid;grid-template-columns:16px repeat(16,1fr);gap:4px;margin-top:10px}
.heat .lbl{font-size:9px;color:var(--mu2);display:grid;place-items:center;font-weight:700}
.heat .c{aspect-ratio:1;border-radius:4px;background:var(--s2)}
.heat .c.l-lift{background:var(--volt)}.heat .c.l-run{background:var(--ora)}
.heat .c.l-both{background:linear-gradient(135deg,var(--volt) 50%,var(--ora) 50%)}
.heat .c.l-rest{background:#3d4b57}
.heat .c.future{background:transparent;border:1px dashed #22222a}
.heat .c.today{outline:2px solid var(--tx);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--mu)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.sess{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden}
.sess summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.sess summary::-webkit-details-marker{display:none}
.sess .bar-i{width:5px;align-self:stretch;border-radius:4px;background:var(--volt)}
.sess.run .bar-i{background:var(--ora)}.sess.rest .bar-i{background:var(--blue)}
.sess .sm-t{flex:1;min-width:0}
.sess .sm-t b{display:block;font-size:15px}
.sess .sm-t span{font-size:12px;color:var(--mu)}
.sess .sm-v{text-align:right;font-size:12px;color:var(--mu)}
.sess .sm-v b{display:block;font-size:15px;color:var(--tx);font-variant-numeric:tabular-nums}
.sess-body{padding:0 14px 14px;border-top:1px solid var(--line)}
.sess-ex{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.sess-ex span:last-child{color:var(--mu);text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:34px 20px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}

/* plan */
.segs{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:14px 0 8px}
.seg{height:10px;border-radius:4px;opacity:.35}
.seg.past,.seg.cur{opacity:1}
.seg.cur{outline:2px solid var(--tx);outline-offset:2px}
.p-foundation{background:var(--blue)}.p-build{background:var(--volt)}.p-deload{background:var(--mu2)}.p-intensify{background:var(--ora)}
.sched{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.sched .dn{width:42px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);font-weight:800}
.sched .st{flex:1}
.sched .st b{display:block;font-size:15px}
.sched .st span{font-size:12px;color:var(--mu)}
.sched .tp{width:9px;height:9px;border-radius:50%;background:var(--volt)}
.sched.run .tp{background:var(--ora)}.sched.rest .tp{background:var(--blue)}
.sched.today{border-color:#45454f}
.vol-row{display:grid;grid-template-columns:92px 1fr 34px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.vol-row .vb{height:10px;border-radius:99px;background:var(--s2);overflow:hidden}
.vol-row .vb i{display:block;height:100%;background:#5d5d68;border-radius:99px}
.vol-row.pri .vb i{background:var(--volt)}
.vol-row b{text-align:right;font-variant-numeric:tabular-nums}
details.pr{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
details.pr summary{padding:14px;font-weight:800;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.pr summary::after{content:"+";color:var(--volt);font-size:20px;line-height:1}
details.pr[open] summary::after{content:"–"}
details.pr summary::-webkit-details-marker{display:none}
details.pr div{padding:0 14px 14px;color:#d4d4da;font-size:14px}
details.pr p{margin:0 0 8px}
.bp{list-style:none;padding:0;margin:10px 0 0}
.bp li{display:flex;gap:10px;font-size:14px;padding:6px 0;color:#dadae0}
.bp li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--volt);margin-top:7px;flex:none}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav) + var(--sb));padding-bottom:var(--sb);background:rgba(12,12,15,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:640px}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mu2);font-size:10.5px;font-weight:800;letter-spacing:.04em}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--volt)}

.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-30px);opacity:0;z-index:120;background:var(--tx);color:#000;font-weight:800;font-size:14px;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:.3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:560px){.hero h1{font-size:44px}}
</style>
</head>

<script>
(function(){

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const p=String(s||'').split('-').map(Number);return new Date(p[0]||2000,(p[1]||1)-1,p[2]||1);};

const fmtClock=s=>{s=Math.max(0,Math.ceil(s));return `${pad(Math.floor(s/60))}:${pad(s%60)}`;};
const fmtDur=ms=>{const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${pad(m)}:${pad(x)}`;};

const fmtDate=s=>parseYmd(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const rep=(n,fn)=>{const o=[];for(let i=1;i<=n;i++)o.push(...fn(i));return o;};
const A=(name,note)=>({name,note});

  check:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

/* ================= STATE ================= */

    return {...d,...s,settings:{...d.settings,...(s.settings||{})},profile:{...d.profile,...(s.profile||{})},

let state=load();

const ui={tab:'train',dayId:null,open:new Set(),swaps:{},histKey:null};

/* ================= PROGRAM LOGIC ================= */
function phaseInfo(){
  const s=parseYmd(state.profile.startDate);const diff=Math.floor((startOfDay(new Date())-s)/86400000);
  const week=Math.max(1,Math.floor(diff/7)+1);const c=((week-1)%12)+1;const block=Math.floor((week-1)/12)+1;
  const p=c<=4?PHASES.foundation:c<=8?PHASES.build:c===9?PHASES.deload:PHASES.intensify;
  return {...p,week,cycleWeek:c,block};
}
function plannedSets(ex){const p=phaseInfo().id;if(p==='deload')return Math.max(1,ex.sets-1);if((p==='build'||p==='intensify')&&ex.priority)return ex.sets+1;return ex.sets;}
function exKey(ex,swaps){const i=swaps?swaps[ex.id]:null;return (i!=null&&i>=0)?`${ex.id}~${i}`:ex.id;}
function exNameByKey(key){const [id,alt]=String(key).split('~');const ex=EX[id];if(!ex)return key;return alt!=null&&ex.alts[+alt]?ex.alts[+alt].name:ex.name;}
function lastPerf(key){for(let i=state.history.length-1;i>=0;i--){const e=(state.history[i].exercises||[]).find(x=>x.key===key);if(e&&e.sets&&e.sets.length)return {date:state.history[i].date,sets:e.sets};}return null;}
function suggestion(ex,last,n){
  const [lo,hi]=ex.reps;const u=ex.unit==='sec'?'sec':'reps';
  if(!last)return {cls:'info',text:`First log: choose a load you could lift ~${hi+3} times, then do ${lo}–${hi} with perfect tempo.`};
  const allTop=last.sets.length>=n&&last.sets.slice(0,n).every(s=>num(s.r)>=hi);
  const anyLow=last.sets.some(s=>num(s.r)<lo);
  if(allTop){const inc=ex.bw||!ex.inc?'add reps/slow the tempo or add a small plate':`+${ex.inc} kg`;return {cls:'up',text:`Top of range hit on every set → ${inc} today. Restart at ${lo} ${u}.`};}
  if(anyLow)return {cls:'hold',text:`Keep the same weight. Goal: ${lo}+ ${u} on every set with full tempo.`};
  return {cls:'go',text:'Same weight — beat last session by at least 1 rep on one set.'};
}
function e1rm(w,r){w=num(w);r=num(r);return w>0?w*(1+r/30):0;}
function estMinutes(day,ph){
  let m=day.mobility?MOB[day.mobility].items.reduce((s,i)=>s+i.s,0)/60:0;
  if(day.type==='lift')m+=day.exercises.reduce((s,e)=>s+plannedSets(e)*(e.rest+40),0)/60;
  else if(day.type==='run')m+=day.blocks(ph).reduce((s,b)=>s+b.secs,0)/60;
  else m+=40;
  return Math.round(m/5)*5;
}
function ensureSets(a,ex){const k=exKey(ex,a.swaps);if(!a.sets[k])a.sets[k]=Array.from({length:plannedSets(ex)},()=>({w:'',r:'',done:false}));return a.sets[k];}
function sessionProgress(day){
  const a=state.active;if(!a||a.dayId!==day.id)return {pct:0,label:''};
  if(day.type==='lift'){let t=0,d=0;day.exercises.forEach(ex=>{const s=ensureSets(a,ex);t+=s.length;d+=s.filter(x=>x.done).length;});return {pct:t?Math.round(d/t*100):0,label:`${d} / ${t} sets complete`};}
  const items=day.type==='run'?day.blocks(phaseInfo()).map(b=>'run-'+b.k):day.checklist.map(c=>c.k);
  const d=items.filter(k=>a.checks[k]).length;return {pct:items.length?Math.round(d/items.length*100):0,label:`${d} / ${items.length} ${day.type==='run'?'blocks':'tasks'} complete`};
}
function startSession(dayId){
  if(state.active){if(state.active.dayId===dayId)return true;toast('Finish or discard your current session first');return false;}
  const day=dayById(dayId);
  const a={dayId,startedAt:Date.now(),sets:{},swaps:{...ui.swaps},checks:{},run:{km:'',min:'',rpe:''},phase:phaseInfo().id};
  if(day.type==='lift')day.exercises.forEach(ex=>ensureSets(a,ex));
  state.active=a;ui.swaps={};save();requestWake();vib(25);toast(`${day.title} started — let's work`);
  return true;
}
function ensureSession(day){if(state.active&&state.active.dayId===day.id)return true;return startSession(day.id);}

/* ================= AUDIO / HAPTICS / WAKE LOCK ================= */
let actx=null;
function unlockAudio(){try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}}
document.addEventListener('pointerdown',unlockAudio,{passive:true});
function tone(f,t0,dur,type,vol){
  const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
  const v=Math.max(0.0002,state.settings.volume*(vol==null?1:vol));
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+0.05);
}
function chime(kind){
  if(!state.settings.sound||!actx)return;
  try{if(actx.state==='suspended')actx.resume();const t=actx.currentTime+0.03;
    if(kind==='tick')tone(1050,t,0.08,'square',0.18);
    else if(kind==='step'){tone(660,t,0.18,'triangle',0.9);tone(990,t+0.16,0.3,'triangle',0.9);}
    else{[784,988,1175,1568].forEach((f,i)=>tone(f,t+i*0.12,0.5,'triangle',0.85));tone(1568,t+0.62,0.9,'sine',0.55);tone(2093,t+0.62,0.9,'sine',0.25);}
  }catch(e){}
}
function vib(p){if(state.settings.vibrate&&navigator.vibrate){try{navigator.vibrate(p);}catch(e){}}}
let wakeLock=null;
async function requestWake(){if(!state.settings.wakeLock||!state.active||!('wakeLock' in navigator)||wakeLock)return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}catch(e){wakeLock=null;}}
function releaseWake(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}}

/* ================= TIMER ENGINE ================= */
const T={running:false,endAt:0,remaining:0,total:0,label:'',queue:[],check:null,dayId:null,lastTick:-1};
(function loadTimer(){try{const t=JSON.parse(localStorage.getItem(LS_TIMER)||'null');if(!t)return;Object.assign(T,t);T.lastTick=-1;
  if(T.running&&T.endAt<=Date.now()){T.running=false;T.remaining=0;T.total=0;T.queue=[];}}catch(e){}})();
function persistTimer(){try{const {running,endAt,remaining,total,label,queue,check,dayId}=T;localStorage.setItem(LS_TIMER,JSON.stringify({running,endAt,remaining,total,label,queue,check,dayId}));}catch(e){}}
const tRem=()=>T.running?Math.max(0,(T.endAt-Date.now())/1000):T.remaining;
function timerStart(secs,label,queue,check,dayId){
  unlockAudio();secs=Math.max(1,Math.round(secs));
  Object.assign(T,{total:secs,remaining:secs,label:label||'Rest',queue:queue||[],check:check||null,dayId:dayId||(state.active&&state.active.dayId)||null,endAt:Date.now()+secs*1000,running:true,lastTick:-1});
  clearAlert();persistTimer();refreshTimerUI();
}
function timerToggle(){
  unlockAudio();
  if(T.running){T.remaining=tRem();T.running=false;}
  else if(T.remaining>0.5){T.endAt=Date.now()+T.remaining*1000;T.running=true;}
  else{timerStart(T.total||state.settings.defaultRest,T.total?T.label.replace("Time's up",'Rest'):'Rest');return;}
  clearAlert();persistTimer();refreshTimerUI();
}
function timerReset(){T.running=false;T.remaining=T.total||state.settings.defaultRest;if(!T.total)T.total=T.remaining;T.lastTick=-1;if(/Time's up/.test(T.label))T.label='Rest';clearAlert();persistTimer();refreshTimerUI();}
function timerClear(){Object.assign(T,{running:false,remaining:0,total:0,label:'',queue:[],check:null,dayId:null});clearAlert();persistTimer();refreshTimerUI();}
function timerAdjust(d){
  if(!T.total){timerStart(Math.max(5,state.settings.defaultRest+d),'Rest');return;}
  if(T.running){T.endAt=Math.max(Date.now()+1000,T.endAt+d*1000);T.total=Math.max(T.total,tRem());}
  else{T.remaining=Math.max(0,T.remaining+d);T.total=Math.max(T.total,T.remaining);}
  persistTimer();tick();
}
function applyCheck(check,dayId){
  const a=state.active;if(!check||!a||a.dayId!==dayId)return;a.checks[check]=true;save();
  const b=document.querySelector(`[data-action="toggleCheck"][data-k="${check}"]`);
  if(b){b.classList.add('on');const li=b.closest('li');if(li)li.classList.add('on');}
  updateProgress();
}
let clearT=null;
function timerFinish(){
  const done={check:T.check,dayId:T.dayId,label:T.label};T.running=false;T.remaining=0;T.lastTick=-1;
  applyCheck(done.check,done.dayId);
  if(T.queue.length){
    const nx=T.queue.shift();chime('step');vib([120,60,120]);
    Object.assign(T,{total:nx.secs,remaining:nx.secs,label:nx.label,check:nx.check||null,endAt:Date.now()+nx.secs*1000,running:true});
    persistTimer();refreshTimerUI();toast(nx.label);
  }else{
    chime('done');vib([260,120,260,120,500]);flashAlert();
    toast(/rest/i.test(done.label)?'Rest complete — attack the next set':'Time! Block complete');
    T.label="Time's up";persistTimer();refreshTimerUI();
    clearTimeout(clearT);clearT=setTimeout(()=>{if(!T.running&&T.remaining===0&&T.total)timerClear();},20000);
  }
}
let titleT=null;const BASE_TITLE=document.title;
function flashAlert(){

function tick(){

    if(r<=0){timerFinish();return;}
    const ri=Math.ceil(r);if(state.settings.ticks&&ri<=3&&ri!==T.lastTick){T.lastTick=ri;chime('tick');}
  }
  const has=T.total>0;const rem=has?tRem():state.settings.defaultRest;const frac=has&&T.total?rem/T.total:1;
  const timeTxt=fmtClock(rem);
  $$('.js-time').forEach(e=>{if(e.textContent!==timeTxt)e.textContent=timeTxt;});
  $$('.js-prog').forEach(e=>{e.style.width=(frac*100).toFixed(1)+'%';});
  $$('.js-ring').forEach(e=>{const C=+e.dataset.c;e.style.strokeDashoffset=(C*(1-frac)).toFixed(1);});

function weekCounts(){const m={};state.history.forEach(h=>{if(h.type==='rest')return;const k=ymd(weekStart(parseYmd(h.date)));m[k]=(m[k]||0)+1;});return m;}
function weekStreak(){
  const m=weekCounts();const t=state.settings.weeklyTarget;let ws=weekStart(new Date());let s=0;
  if((m[ymd(ws)]||0)>=t)s=1;ws=addDays(ws,-7);
  while((m[ymd(ws)]||0)>=t&&s<520){s++;ws=addDays(ws,-7);}return s;
}
function sparkline(pts,color,unit){
  if(pts.length<2)return `<p class="muted small">Log at least two sessions to see a trend line.</p>`;
  const W=320,H=130,px=10,py=18;const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx===mn){mx+=1;mn-=1;}
  const X=i=>px+i*(W-2*px)/(pts.length-1);const Y=v=>H-py-(v-mn)/(mx-mn)*(H-2*py);
  const line=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const gid='g'+Math.random().toString(36).slice(2,7);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${X(0)},${H-py} ${line} ${X(pts.length-1)},${H-py}" fill="url(#${gid})"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.2" fill="${color}"/>`).join('')}
    <text x="${px}" y="12" fill="#9b9ba6" font-size="10" font-weight="700">${mx.toFixed(1)} ${unit}</text>
    <text x="${px}" y="${H-3}" fill="#9b9ba6" font-size="10" font-weight="700">${mn.toFixed(1)} ${unit}</text></svg>`;
}
function renderHistory(){
  const H=state.history;const train=H.filter(h=>h.type!=='rest');const t=state.settings.weeklyTarget;
  const ws=weekStart(new Date());const thisWeek=train.filter(h=>parseYmd(h.date)>=ws).length;
  const vol=train.reduce((s,h)=>s+(h.volume||0),0);const km=train.reduce((s,h)=>s+(h.run?num(h.run.km):0),0);
  const C=2*Math.PI*34;const f=Math.min(1,thisWeek/t);
  const start=addDays(ws,-7*15);const today=startOfDay(new Date());const map={};
  H.forEach(h=>{const m=map[h.date]||(map[h.date]={});m[h.type]=true;});

    const cls=day>today?'future':m.lift&&m.run?'l-both':m.lift?'l-lift':m.run?'l-run':m.rest?'l-rest':'';
    cells+=`<span class="c ${cls} ${k===ymd(today)?'today':''}" style="grid-row:${d+1};grid-column:${w+2}" title="${k}"></span>`;}
  const keys=[...new Set(H.flatMap(h=>(h.exercises||[]).map(e=>e.key)))].sort((a,b)=>exNameByKey(a).localeCompare(exNameByKey(b)));
  if(!ui.histKey||!keys.includes(ui.histKey))ui.histKey=keys[0]||null;

      pts.push({y,date:h.date});e.sets.forEach(s=>{if(!best||num(s.w)>num(best.w)||(num(s.w)===num(best.w)&&num(s.r)>num(best.r)))best=s;});});
    const anyW=pts.length&&H.some(h=>(h.exercises||[]).some(e=>e.key===ui.histKey&&e.sets.some(s=>num(s.w)>0)));
    prog=`<select class="field" id="histSelect" aria-label="Choose exercise">${keys.map(k=>`<option value="${esc(k)}" ${k===ui.histKey?'selected':''}>${esc(exNameByKey(k))}</option>`).join('')}</select>

      :h.type==='run'?`<div class="sess-ex"><span>Distance</span><span>${h.run&&h.run.km?esc(h.run.km)+' km':'–'}</span></div><div class="sess-ex"><span>Time</span><span>${h.run&&h.run.min?esc(h.run.min)+' min':'–'}</span></div><div class="sess-ex"><span>Pace</span><span>${esc(h.run&&h.run.pace||'–')}</span></div><div class="sess-ex"><span>RPE</span><span>${esc(h.run&&h.run.rpe||'–')}</span></div><div class="sess-ex"><span>Blocks done</span><span>${h.run?h.run.blocksDone:0}</span></div>`

  return `<div class="stats">
    <div class="stat big"><div class="mini-ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="#1a1a1f" stroke-width="8"/><circle cx="40" cy="40" r="34" fill="none" stroke="#d7ff3c" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-f)).toFixed(1)}"/></svg><div>${thisWeek}/${t}</div></div>

    <div class="stat"><b>${km.toFixed(1)}</b><span>Km run</span></div></div>
  <section class="card"><div class="eyebrow">Consistency</div><h2>Last 16 Weeks</h2><div class="heat">${cells}</div>

  <section class="card"><div class="eyebrow">Strength</div><h2>Exercise Progress</h2>${prog}</section>
  <div class="section-title"><h2>Sessions</h2><span class="muted small">${H.length} logged</span></div>
  ${list||'<div class="empty"><b>No sessions yet</b>Finish your first workout to start your streak.</div>'}`;
}

/* ================= SESSION FINISH ================= */
function finishSession(){
  const a=state.active;if(!a)return;const day=dayById(a.dayId);
  const entry={id:uid(),dayId:day.id,title:day.title,tag:day.tag,type:day.type,date:ymd(new Date(a.startedAt)),startedAt:a.startedAt,endedAt:Date.now(),
    durationMin:Math.max(1,Math.round((Date.now()-a.startedAt)/60000)),exercises:[],volume:0,setsDone:0,phase:phaseInfo().name,
    mobilityDone:Object.keys(a.checks).filter(k=>k.startsWith('mob-')&&a.checks[k]).length};
  if(day.type==='lift'){
    day.exercises.forEach(ex=>{Object.keys(a.sets).filter(k=>k===ex.id||k.startsWith(ex.id+'~')).forEach(k=>{
      const done=a.sets[k].filter(s=>s.done).map(s=>({w:num(s.w),r:num(s.r)}));
      if(done.length){entry.exercises.push({key:k,name:exNameByKey(k),muscle:ex.muscle,sets:done});entry.setsDone+=done.length;entry.volume+=done.reduce((t,s)=>t+s.w*s.r,0);}});});
    if(!entry.setsDone&&!confirm('No sets were checked off. Save this session anyway?'))return;
  }else if(day.type==='run'){
    const km=num(a.run.km),min=num(a.run.min);let pace='';
    if(km>0&&min>0){const p=min/km;let m=Math.floor(p),s=Math.round((p-m)*60);if(s===60){m++;s=0;}pace=`${m}:${pad(s)} /km`;}
    entry.run={km:a.run.km,min:a.run.min,rpe:a.run.rpe,pace,blocksDone:Object.keys(a.checks).filter(k=>k.startsWith('run-')&&a.checks[k]).length};
  }else{entry.tasksDone=Object.keys(a.checks).filter(k=>k.startsWith('r')&&!k.startsWith('run-')&&a.checks[k]).length;}
  state.history.push(entry);state.active=null;save();releaseWake();
  if(T.dayId===entry.dayId&&T.queue.length)timerClear();
  chime('step');vib([40,40,80]);
  toast(day.type==='lift'?`Saved · ${entry.setsDone} sets · ${Math.round(entry.volume).toLocaleString()} kg moved`:'Session saved — streak updated');
  ui.tab='history';render();window.scrollTo(0,0);
}

function handleImport(file){

    if(!confirm(`Import backup with ${d.history.length} sessions? This replaces current data.`))return;
    localStorage.setItem(LS_KEY,JSON.stringify(d));state=load();save();render();toast('Backup imported');}catch(e){toast('That file is not a valid backup');}};
  r.readAsText(file);
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=actions[el.dataset.action];if(fn){e.preventDefault();fn(el,e);}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.matches('.set-row input')){const a=state.active;if(!a)return;const row=el.closest('.set-row');const arr=a.sets[row.dataset.key];if(!arr)return;arr[+row.dataset.i][el.dataset.f]=el.value.replace(',','.').trim();saveSoon();}
  else if(el.dataset.run){const a=state.active;if(!a)return;a.run[el.dataset.run]=el.value;updatePace();saveSoon();}
  else if(el.dataset.setting&&el.type==='range'){state.settings[el.dataset.setting]=+el.value;saveSoon();}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.run){const a=state.active;if(a){a.run[el.dataset.run]=el.value;updatePace();save();}}
  else if(el.dataset.setting){const k=el.dataset.setting;state.settings[k]=el.type==='checkbox'?el.checked:+el.value;save();
    if(k==='wakeLock')state.settings[k]?requestWake():releaseWake();
    if(k==='volume'){unlockAudio();chime('tick');}}
  else if(el.dataset.profile){const k=el.dataset.profile;
    if(k==='startDate'){if(!el.value)return;state.profile[k]=el.value;}else if(k==='sex')state.profile[k]=el.value;else state.profile[k]=el.value===''?'':num(el.value);
    save();render();}
  else if(el.id==='histSelect'){ui.histKey=el.value;render();}
  else if(el.id==='importFile'){handleImport(el.files[0]);el.value='';}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.set-row input'))e.target.blur();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){requestWake();tick();}else{save();persistTimer();}});
window.addEventListener('pagehide',()=>{save();persistTimer();});

render();
if(state.active)requestWake();
})();
</script>
</body>
</html>
